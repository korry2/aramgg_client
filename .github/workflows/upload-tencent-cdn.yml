name: Upload Windows Release to Tencent CDN

on:
  workflow_call:
    inputs:
      release-tag:
        description: GitHub Release tag to upload
        required: true
        type: string

permissions:
  contents: read

jobs:
  upload:
    name: Upload and verify CDN assets
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: production
    concurrency:
      group: aramgg-client-windows-cdn-production
      cancel-in-progress: false

    env:
      RELEASE_TAG: ${{ inputs.release-tag }}
      TENCENT_COS_SECRET_ID: ${{ secrets.TENCENT_COS_SECRET_ID }}
      TENCENT_COS_SECRET_KEY: ${{ secrets.TENCENT_COS_SECRET_KEY }}
      TENCENT_COS_BUCKET: ${{ secrets.TENCENT_COS_BUCKET }}
      TENCENT_COS_REGION: ${{ secrets.TENCENT_COS_REGION }}
      TENCENT_COS_PREFIX: ${{ secrets.TENCENT_COS_PREFIX }}
      TENCENT_EDGEONE_ZONE_ID: ${{ secrets.TENCENT_EDGEONE_ZONE_ID }}
      TENCENT_EDGEONE_SECRET_ID: ${{ secrets.TENCENT_EDGEONE_SECRET_ID }}
      TENCENT_EDGEONE_SECRET_KEY: ${{ secrets.TENCENT_EDGEONE_SECRET_KEY }}

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22.18.0'
          cache: npm
          cache-dependency-path: scripts/release-cdn/package-lock.json

      - name: Download GitHub Release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Invalid release tag: $RELEASE_TAG" >&2
            exit 1
          fi

          mkdir -p release-assets
          gh release download "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --dir release-assets \
            --pattern 'latest.yml' \
            --pattern '*.exe' \
            --pattern '*.exe.blockmap'

      - name: Install CDN uploader dependencies
        run: npm ci --ignore-scripts --prefix scripts/release-cdn

      - name: Validate release assets
        run: node scripts/release-cdn/upload-release.mjs --assets=release-assets --tag="$RELEASE_TAG" --dry-run

      - name: Upload and verify Tencent CDN
        run: node scripts/release-cdn/upload-release.mjs --assets=release-assets --tag="$RELEASE_TAG"
